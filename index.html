<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verhaal Zwamzakken</title>
    <style>
        /* CSS voor de knop */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: sans-serif;
        }

        #playPauseButton {
            padding: 30px 60px; /* Maakt de knop groot */
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 15px;
            background-color: #4CAF50; /* Groene kleur */
            color: white;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 9px #999;
        }

        #playPauseButton:hover {
            background-color: #45a049;
        }

        #playPauseButton:active {
            background-color: #3e8e41;
            box-shadow: 0 5px #666;
            transform: translateY(4px);
        }
    </style>
</head>
<body>

    <button id="playPauseButton">▶️ Start Verhaal</button>

    <audio id="audio1" src="Voorleestekst2.mp3"></audio>
    <audio id="audio2" src="Zwamzakken_lied.mp3"></audio>
    <audio id="audio3" src="laatste.mp3"></audio>

    <script>
        // Lijst van de ID's van de audio-elementen in de gewenste volgorde
        const audioIDs = ['audio1', 'audio2', 'audio3'];
        let currentAudioIndex = 0;
        let isPlaying = false;

        // Haal de elementen op
        const button = document.getElementById('playPauseButton');
        const audioElements = audioIDs.map(id => document.getElementById(id));

        // Functie om het volgende audiobestand af te spelen
        function playNext() {
            // Controleer of er nog audiobestanden in de lijst zijn
            if (currentAudioIndex < audioIDs.length) {
                const currentAudio = audioElements[currentAudioIndex];
                
                // Voeg een 'ended' event listener toe om door te gaan naar de volgende wanneer deze klaar is
                currentAudio.onended = () => {
                    currentAudioIndex++;
                    playNext(); // Speel de volgende af
                };
                
                // Speel het huidige bestand af
                currentAudio.play().catch(error => {
                    console.error("Fout bij het afspelen van audio:", error);
                    // Probeer de volgende af te spelen als er een fout is
                    currentAudioIndex++;
                    playNext();
                });
                
                // Update de knoptekst
                button.textContent = '⏸️ Pauzeer';

            } else {
                // Alle bestanden zijn afgespeeld
                isPlaying = false;
                currentAudioIndex = 0; // Reset voor herhaling
                button.textContent = '▶️ Herstart Verhaal';
                // Haal de 'onended' listeners weg om te voorkomen dat ze opnieuw getriggerd worden bij herstart
                audioElements.forEach(audio => audio.onended = null);
            }
        }

        // Functie om af te spelen/pauzeren
        function togglePlayPause() {
            if (isPlaying) {
                // Pauzeer het huidige bestand
                audioElements[currentAudioIndex].pause();
                isPlaying = false;
                button.textContent = '▶️ Hervat';
            } else {
                // Start of hervat het afspelen
                isPlaying = true;
                playNext();
            }
        }

        // Luister naar de klik op de knop
        button.addEventListener('click', togglePlayPause);

        // Zorg ervoor dat de audiobestanden correct kunnen herstarten als er middenin gepauzeerd wordt
        // en de gebruiker op Herstart drukt.
        button.addEventListener('click', () => {
            if (currentAudioIndex === 0 && !isPlaying) {
                // Als de gebruiker klikt om te starten nadat alles is afgespeeld, 
                // spoel alle audio terug naar het begin.
                audioElements.forEach(audio => audio.currentTime = 0);
            }
        });
        
    </script>

</body>
</html>
