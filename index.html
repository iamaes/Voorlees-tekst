<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Voorlees-site — De Zwamzakken</title>
  <style>
    :root{--bg:#f7fbf7;--card:#ffffff;--accent:#2a9d8f;--accent-2:#264653;--muted:#7a7a7a}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial}
    body{background:linear-gradient(180deg,#eaf6f2,white);display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:980px;max-width:100%;background:var(--card);border-radius:18px;box-shadow:0 8px 30px rgba(30,30,30,.08);padding:18px}
    h1{margin:0;font-size:20px;color:var(--accent-2)}
    .controls{display:flex;gap:12px;align-items:center;margin-top:12px}
    button{background:var(--accent);border:none;color:white;padding:12px 14px;border-radius:12px;font-size:16px;box-shadow:0 6px 18px rgba(42,157,143,.18)}
    button.secondary{background:#eee;color:var(--accent-2);box-shadow:none}
    button.big{padding:22px 26px;font-size:28px;border-radius:20px}
    .story{line-height:1.9;font-size:19px;color:#222;max-height:60vh;overflow:auto;padding:16px;border-radius:10px;background:linear-gradient(180deg,#fff,#fbfffb)}
    .big-buttons{display:flex;gap:8px}
  </style>
</head>

<body>
  <div class="card">
    <header>
      <h1>De Zwamzakken — voorleesmodus</h1>
    </header>

    <div class="controls">
      <div class="big-buttons">
        <button id="playPause" class="big">▶︎</button>
      </div>
      <button id="stop" class="secondary small">Stop</button>
    </div>

    <main>
      <div id="story" class="story"></div>
    </main>
  </div>

  <!-- Voorlees-audio -->
  <audio id="voiceAudio" src="De Zwamzakken_artevelde.mp3"></audio>

  <!-- Lied -->
  <audio id="song" src="Zwamzakken_lied.mp3"></audio>

<script>
  // De volledige tekst die op het scherm moet verschijnen
  const storyText = `
Lieve Chaya, zegt Paul de Mol voorzichtig…
Jij zingt over liefde, mooi en lief…
Jij bent echt een harte-dief.
Chaya’s champi moet heel erg blozen.
(belletje, zodat kind weet dat hij de pagina moet omslaan)

Vanavond, zegt Paul, geef ik een feestje bij de grote blauwe vijver…
(belletje, zodat kind weet dat hij de pagina moet omslaan)

…op de oude mooie boerderij.
En het wordt reuzeleuk met jou erbij!
(belletje, zodat kind weet dat hij de pagina moet omslaan)

Het liedje van de zwamzakken: ( = computerstem laten inspreken)
liedje : "Zwamzakken_lied.mp3"

Wij zijn de Zwamzakken, hopla hopla ho!
Wij spelen muziek, daar word je blij van zo!
Toet-toet, pling-pling, ratatam-tam-tam,
Sterk van planten, ja dat kan!

Charley slaat, op z’n trommel zo hard,
Oekie tokkelt, op haar gitaar zo zacht,
Chaya blaast, op haar trompetje,
Plantenkracht, dat is een pretje!

Wij zijn de Zwamzakken, hopla hopla ho!
Wij spelen muziek, daar word je blij van zo!
Toet-toet, pling-pling, ratatam-tam-tam,
Sterk van planten, ja dat kan!

Einde ( = computerstem laten inspreken)

Hierna kan je nog een spelletje spelen, een puzzel maken en een receptje maken met jouw ouders! (= computerstem laten inspreken)
`;

  // Tekst in het document zetten
  document.getElementById('story').textContent = storyText;

  const audio = document.getElementById('voiceAudio');
  const playBtn = document.getElementById('playPause');
  const stopBtn = document.getElementById('stop');

  function updateButton(){
    playBtn.textContent = audio.paused ? '▶︎' : '⏸︎';
  }

  playBtn.onclick = ()=>{
    if(audio.paused){ audio.play(); }
    else{ audio.pause(); }
    updateButton();
  };

  stopBtn.onclick = ()=>{
    audio.pause();
    audio.currentTime = 0;
    updateButton();
  };

  audio.onended = updateButton;
</script>
</body>
</html>
