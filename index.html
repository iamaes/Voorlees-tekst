<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Verhaal-zwamzakken</title>
    <style>
        /* Optionele CSS voor een betere look */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        #play-pause-btn {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Verhaal-zwamzakken</h1>

    <audio id="verhaal-audio" src="De Zwamzakken_artevelde.mp3"></audio>
    <audio id="liedje-audio" src="Zwamzakken_lied.mp3"></audio>

    <button id="play-pause-btn">▶ Afspelen</button>

    <p id="status-text">Klaar om te starten.</p>

    <script>
        // Selecteer de audio-elementen en de knop
        const verhaalAudio = document.getElementById('verhaal-audio');
        const liedjeAudio = document.getElementById('liedje-audio');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const statusText = document.getElementById('status-text');

        let isPlaying = false; // Houdt de huidige afspeelstatus bij
        let isVerhaalPlaying = false; // Houdt bij of het verhaal bezig is
        
        // --- Functie om de afspeelsequentie te starten of te pauzeren ---
        function togglePlayPause() {
            if (isPlaying) {
                // Pauzeer alles
                verhaalAudio.pause();
                liedjeAudio.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶ Afspelen';
                statusText.textContent = 'Gepauzeerd.';
            } else {
                // Start of hervat het afspelen
                isPlaying = true;
                playPauseBtn.textContent = '⏸ Pauze';

                if (verhaalAudio.currentTime > 0 && !verhaalAudio.ended) {
                    // Hervat het verhaal
                    verhaalAudio.play();
                    statusText.textContent = 'Verhaal wordt hervat...';
                    isVerhaalPlaying = true;
                } else if (liedjeAudio.currentTime > 0 && !liedjeAudio.ended) {
                    // Hervat het liedje
                    liedjeAudio.play();
                    statusText.textContent = 'Liedje wordt hervat...';
                    isVerhaalPlaying = false;
                } else {
                    // Start vanaf het begin (reset liedje voor de zekerheid)
                    liedjeAudio.currentTime = 0;
                    
                    // Start met het eerste bestand (het verhaal)
                    verhaalAudio.play();
                    statusText.textContent = 'Verhaal wordt afgespeeld...';
                    isVerhaalPlaying = true;
                }
            }
        }

        // --- Logica om het verhaal te laten overgaan in het liedje ---
        verhaalAudio.onended = function() {
            if (isPlaying) {
                // Het verhaal is afgelopen, begin het liedje
                isVerhaalPlaying = false;
                liedjeAudio.play();
                statusText.textContent = 'Liedje wordt afgespeeld...';
            }
        };

        // --- Logica wanneer het liedje ook is afgelopen ---
        liedjeAudio.onended = function() {
            // Alles is afgelopen
            isPlaying = false;
            playPauseBtn.textContent = '▶ Opnieuw Afspelen';
            statusText.textContent = 'Alles is afgelopen. Druk op de knop om opnieuw te starten.';
            
            // Zet beide bestanden terug naar het beginpunt
            verhaalAudio.currentTime = 0;
            liedjeAudio.currentTime = 0;
            isVerhaalPlaying = false;
        };

        // --- Event Listener voor de knop ---
        playPauseBtn.addEventListener('click', togglePlayPause);
        
        // Zorg ervoor dat de pauze-status goed ingesteld is als een bestand vanzelf pauzeert (bijv. door een error)
        verhaalAudio.onpause = liedjeAudio.onpause = function() {
            if (!verhaalAudio.ended && !liedjeAudio.ended && isPlaying) {
                 // Dit kan gebeuren bij handmatige pauze
            } else if (!verhaalAudio.ended && !liedjeAudio.ended) {
                // Handmatig gepauzeerd door knop of andere gebeurtenis
                isPlaying = false;
                playPauseBtn.textContent = '▶ Hervat';
            }
        };

    </script>

</body>
</html>
