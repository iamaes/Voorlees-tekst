<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verhaal zwamzakken</title>
    <style>
        /* Optionele CSS om de knop er netter uit te laten zien */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f4f4f4;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>Verhaal Zwamzakken</h1>
    
    <button id="playPauseButton">Speel Af / Pauzeer</button>

    <audio id="audioStory" preload="auto">
        <source src="Voorleestekst.mp3" type="audio/mpeg">
        Uw browser ondersteunt het audio-element niet.
    </audio>

    <audio id="audioSong" preload="auto">
        <source src="Zwamzakken_lied.mp3" type="audio/mpeg">
        Uw browser ondersteunt het audio-element niet.
    </audio>
    
    <audio id="audioLast" preload="auto">
        <source src="laatste.mp3" type="audio/mpeg">
        Uw browser ondersteunt het audio-element niet.
    </audio>

    <script>
        // Pak de HTML-elementen
        const story = document.getElementById('audioStory');
        const song = document.getElementById('audioSong');
        // **NIEUW:** Pak het laatste audio-element
        const last = document.getElementById('audioLast'); 
        const playPauseButton = document.getElementById('playPauseButton');

        // Houd bij welk audio-element momenteel actief is
        let currentAudio = story;

        // --- Event Listener voor de Speel/Pauze-knop ---
        playPauseButton.addEventListener('click', function() {
            // Controleer of de huidige audio is gepauzeerd
            if (currentAudio.paused) {
                // Speel af
                currentAudio.play().catch(error => {
                    console.error("Fout bij afspelen:", error);
                    alert("Kan niet automatisch afspelen. Probeer handmatig af te spelen.");
                });
            } else {
                // Pauzeer
                currentAudio.pause();
            }
        });

        // --- Event Listener voor het automatisch overgaan naar het liedje (na verhaal) ---
        story.addEventListener('ended', function() {
            story.pause(); 
            // Stel de huidige audio in op het liedje
            currentAudio = song;
            // Speel het liedje af
            currentAudio.play().catch(error => {
                console.error("Fout bij automatisch afspelen van lied:", error);
                alert("Het lied kon niet automatisch starten.");
            });
        });

        // --- **NIEUW:** Event Listener voor het automatisch overgaan naar "laatste.mp3" (na liedje) ---
        song.addEventListener('ended', function() {
            song.pause(); 
            // Stel de huidige audio in op "laatste.mp3"
            currentAudio = last;
            // Speel "laatste.mp3" af
            currentAudio.play().catch(error => {
                console.error("Fout bij automatisch afspelen van laatste bestand:", error);
                alert("Het laatste audiobestand kon niet automatisch starten.");
            });
        });
        
        // TIP: Als je op de knop drukt tijdens het laatste.mp3, pauzeert het.
        // Als je het verhaal opnieuw wilt starten, moet je de pagina herladen.

    </script>

</body>
</html>
